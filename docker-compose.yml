services:
  frontend:
    container_name: phillipharrington-frontend
    build: .
    ports:
      - "5177:5173"
    environment:
      # File-change events from macOS into the container get dropped; see vite.config.js.
      WATCH_POLL: "1"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      # The PHP course's examples, for <code-file> (site.config.js codeRoot).
      - ../web-nerdism-php:/web-nerdism-php:ro
    networks:
      - shared

volumes:
  node_modules:

networks:
  shared:
    external: true
