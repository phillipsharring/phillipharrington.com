<!-- The $2 tip: one small, practical, cheap trick. Not a summary. ("I want
     my two dollars!", Better Off Dead, 1985.) Its own styling, not a box: the
     green label is run in at the start of the first paragraph, by CSS, so it
     shares that line's baseline and the text wraps under it. Optional title:
     the tip in a few words, in bold, and then it's the title the label leads.
     A subtle dashed green rule above and below sets it apart without boxing it.
     A big tilted dollar sign sits behind the text in the top-right corner, the
     way the quote mark does in a pull quote: accent color, low opacity, isolate
     plus a negative z-index keeps it below the words, and overflow-hidden lets
     the edge crop it. -->
<div
    class="border-th-accent-soft relative isolate max-w-[60ch] overflow-hidden space-y-3 border-y border-dashed py-2 [&>p:first-of-type]:before:font-display [&>p:first-of-type]:before:text-th-accent [&>p:first-of-type]:before:mr-2 [&>p:first-of-type]:before:text-base [&>p:first-of-type]:before:font-semibold [&>p:first-of-type]:before:tracking-widest [&>p:first-of-type]:before:uppercase [&>p:first-of-type]:before:content-['$2_Tip']"
>
    <svg
        aria-hidden="true"
        viewBox="0 0 60 78"
        class="text-th-accent pointer-events-none absolute -top-4 -right-5 -z-10 w-20 rotate-12 opacity-15"
    >
        <g fill="none" stroke="currentColor" stroke-width="11">
            <path d="M 30 10 L 30 73" />
            <path
                d="M 47 24.25 C 43 16.75 35 13.75 29 13.75 C 19 13.75 12 18.25 12 25 C 12 32.5 20 35.5 30 37.75 C 42 40.75 49 44.5 49 52 C 49 59.5 41 64.75 30 64.75 C 21 64.75 14 61.75 11 55.75"
            />
        </g>
    </svg>
    [[#if title]]<p class="text-th-heading font-bold">[[title]]</p>[[/if]]
    [[slot]]
</div>
