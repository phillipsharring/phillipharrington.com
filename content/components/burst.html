<!-- A sticker: a tilted starburst in the upper right of whatever it wraps
     (usually a page's title and byline), with a few words on it, like a sale
     sticker on a record sleeve. It hangs off the corner on purpose, and isn't
     cropped. The wrapped content gets right padding so a long title wraps
     before it runs under the sticker. Colors are --burst-* in style.css, a step
     louder than the rest of the site. For a category worth flagging across
     pages: "One of the 2 hardest things in programming" (Naming Things,
     Caching), maybe "Never trust input" some day. -->
<div class="relative">
    <div class="pr-24 sm:pr-40">[[slot]]</div>
    <div
        class="pointer-events-none absolute -top-6 -right-3 z-10 w-28 rotate-12 sm:-top-8 sm:-right-6 sm:w-40"
    >
        <svg aria-hidden="true" viewBox="0 0 100 100" class="block h-auto w-full drop-shadow-sm">
            <polygon
                points="50.0,0.0 58.0,9.8 69.1,3.8 72.8,15.9 85.4,14.6 84.1,27.2 96.2,30.9 90.2,42.0 100.0,50.0 90.2,58.0 96.2,69.1 84.1,72.8 85.4,85.4 72.8,84.1 69.1,96.2 58.0,90.2 50.0,100.0 42.0,90.2 30.9,96.2 27.2,84.1 14.6,85.4 15.9,72.8 3.8,69.1 9.8,58.0 0.0,50.0 9.8,42.0 3.8,30.9 15.9,27.2 14.6,14.6 27.2,15.9 30.9,3.8 42.0,9.8"
                fill="var(--burst-fill)"
                stroke="var(--burst-edge)"
                stroke-width="1.5"
                stroke-linejoin="round"
            />
        </svg>
        <p
            class="font-display absolute inset-0 m-0 flex items-center justify-center px-[19%] text-center text-[0.6rem] leading-tight font-extrabold tracking-wide text-[var(--burst-text)] uppercase sm:text-[0.8rem]"
        >
            [[text]]
        </p>
    </div>
</div>
