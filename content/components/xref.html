<!-- A cross-reference: a link to another page of the course. Quieter than a
     regular link, so a paragraph full of them still reads as a paragraph: the
     text stays the text color, with a thin, faded underline that wakes up on
     hover. Regular links are for leaving the course. -->
<!-- prettier-ignore -->
<a href="[[to]]" class="link-themed text-inherit underline decoration-1 underline-offset-[3px] transition-colors duration-200 hover:text-th-accent">[[slot]]</a>
