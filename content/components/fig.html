<figure
    [[#if center]]class="mx-auto mt-12 w-full max-w-sm"
    [[else]]class="mb-10 w-full sm:float-right sm:m-0 sm:mb-4 sm:ml-4 sm:w-1/3"
    [[/if]]
>
    <!-- Linked to its biggest version unless nozoom: worth it only when that file
         is clearly bigger than the figure shows it (full = a -full.webp exists). -->
    [[#if nozoom]][[else]]<a
        href="[[#if img]]/img/[[img]][[#if full]]-full[[/if]].webp[[else]][[src]][[/if]]"
        class="block"
        >[[/if]]
        <img
            [[#if img]]src="/img/[[img]].webp"
            srcset="/img/[[img]]-400.webp 400w, /img/[[img]].webp [[w]]w"
            sizes="[[#if center]]384px[[else]](min-width: 640px) 300px, 288px[[/if]]"
            [[else]]src="[[src]]"
            [[/if]]
            width="[[w]]"
            height="[[h]]"
            alt="[[alt]]"
            [[#if priority]]fetchpriority="high"
            [[/if]]
            class="border-th-border-strong [[#if center]]max-w-none[[else]]max-w-72[[/if]] mx-auto w-full rounded-lg border sm:w-full"
        />
        [[#if nozoom]][[else]]</a
    >[[/if]]
    <figcaption class="text-th-sub mt-2 text-center font-serif italic">
        [[caption]] [[#if credit]]<asterisk />[[/if]]
    </figcaption>
</figure>
