<figure class="mb-10 w-full sm:float-right sm:m-0 sm:mb-4 sm:ml-4 sm:w-1/3">
    <img
        src="[[src]]"
        alt="[[alt]]"
        width="[[width]]"
        height="[[height]]"
        class="border-th-border-strong mx-auto w-full max-w-72 rounded-lg border sm:w-full"
    />
    <figcaption class="text-th-sub mt-2 text-center font-serif italic">
        [[caption]]
        <asterisk />
    </figcaption>
</figure>
