<!-- The newest approved comment anywhere on the site, from
     /api/comments/latest.json (the Lambda rewrites it on every approval).
     Hidden until src/comments.js has one to show, so there's never an empty
     section; same margin-column look as a post's comments, text only. -->
<section data-latest-comment hidden class="reveal pb-16 sm:pb-24">
    <section-heading label="Latest Comment" />
    <div class="grid gap-x-6 gap-y-1 sm:grid-cols-[7rem_1fr] sm:items-baseline">
        <time
            data-latest-date
            class="text-th-muted font-display text-sm tabular-nums sm:text-right"
        ></time>
        <div>
            <p class="m-0">
                <span data-latest-name class="text-th-heading font-semibold"></span>
                <span class="text-th-muted">on</span>
                <a
                    data-latest-link
                    class="link-themed text-th-accent font-normal underline underline-offset-2 transition-colors duration-200"
                ></a>
            </p>
            <p data-latest-body class="mt-1 line-clamp-4 whitespace-pre-line"></p>
        </div>
    </div>
</section>
