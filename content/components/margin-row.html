<!-- A margin note (Tufte): a short label in the left column ("Nov 2026",
     "1990s", "Age 9") beside the content. Formerly "band", from when it only
     held bands on Music. (No tag names in this comment: the build expands them.) sm:items-baseline puts the label on the same baseline as the first line of
     the right column, whatever starts it (a heading, body text, a job row). -->
<div class="grid gap-x-6 gap-y-1 sm:grid-cols-[7rem_1fr] sm:items-baseline">
    <p class="text-th-muted font-display text-sm tabular-nums sm:text-right">[[label]]</p>
    <div class="space-y-3">[[slot]]</div>
</div>
