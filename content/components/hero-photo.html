<!-- The width lives on the figure, not the image: with the figure sized only
     by its contents, an image that's "100% of the figure" has no width until it
     loads, so on phones the figure collapsed and everything below it jumped when
     the photo arrived (a layout shift). Now the box is reserved from the start. -->
<figure class="w-full max-w-xs sm:w-60 sm:max-w-none md:w-72 lg:w-96">
    <a href="/img/[[img]][[#if full]]-full[[/if]].webp" class="block">
        <img
            src="/img/[[img]].webp"
            srcset="/img/[[img]]-400.webp 400w, /img/[[img]].webp [[w]]w"
            sizes="(min-width: 1024px) 384px, (min-width: 768px) 288px, (min-width: 640px) 240px, 320px"
            width="[[w]]"
            height="[[h]]"
            alt="[[alt]]"
            fetchpriority="high"
            class="[[#if plain]][[else]]hero-frame[[/if]] block h-auto w-full"
        />
    </a>
    [[#if caption]]
    <!-- w-0 min-w-full: the caption adds nothing to the figure's width, so a long
         one wraps at the photo's edge instead of widening the figure. -->
    <figcaption class="text-th-sub mt-2 w-0 min-w-full text-center font-serif text-sm italic">
        [[caption]]
    </figcaption>
    [[/if]]
</figure>
