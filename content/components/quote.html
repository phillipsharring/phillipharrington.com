<!-- Pull quote. Shrinks to fit its text (capped at the article line length)
     and centers, so a one-liner doesn't sit in a half-empty box off to the left.
    The quote mark is the old left-quotes artwork, back as inline SVG in the
    accent color at low opacity, tucked into the corner behind the text (isolate
    plus a negative z-index keeps it above the box's tint, below the words). -->
<blockquote
    class="border-th-accent-soft bg-th-tint text-th-sub relative isolate mx-auto block w-fit max-w-[60ch] overflow-hidden rounded-lg border-l-4 px-8 py-6 italic"
>
    <svg
        aria-hidden="true"
        viewBox="0 11.7 90 66.6"
        class="text-th-accent pointer-events-none absolute -top-2 -left-2 -z-10 w-20 opacity-15"
    >
        <path
            fill="currentColor"
            d="M 20.725 36.82 c -2.722 0 -5.315 0.539 -7.697 1.493 c 1.889 -6.507 4.872 -13.213 8.997 -19.695 c 1.552 -2.439 3.218 -4.716 4.941 -6.887 c -6.678 3.58 -13.313 9.753 -18.499 17.903 C 2.64 38.79 -0.159 48.546 0.042 56.721 C 0.031 56.996 0 57.266 0 57.544 c 0 3.88 1.086 7.497 2.941 10.602 c 0.001 0.002 0.003 0.005 0.004 0.007 c 3.619 6.051 10.216 10.116 17.78 10.116 c 11.446 0 20.725 -9.279 20.725 -20.725 C 41.449 46.098 32.17 36.82 20.725 36.82 z"
        />
        <path
            fill="currentColor"
            d="M 69.275 36.82 c -2.722 0 -5.315 0.539 -7.697 1.493 c 1.889 -6.507 4.872 -13.213 8.997 -19.695 c 1.552 -2.439 3.218 -4.716 4.941 -6.887 c -6.678 3.58 -13.313 9.753 -18.499 17.903 c -5.826 9.156 -8.625 18.912 -8.425 27.087 c -0.011 0.275 -0.042 0.546 -0.042 0.824 c 0 3.88 1.086 7.497 2.941 10.602 c 0.001 0.002 0.003 0.005 0.004 0.007 c 3.619 6.051 10.216 10.116 17.78 10.116 C 80.721 78.269 90 68.99 90 57.544 C 90 46.098 80.721 36.82 69.275 36.82 z"
        />
    </svg>
    [[slot]] [[#if citation]]
    <footer>
        <cite class="text-th-faint float-right mt-4 text-sm not-italic">&mdash; [[citation]]</cite>
    </footer>
    [[/if]]
</blockquote>
