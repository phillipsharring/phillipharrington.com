<!-- A command or line of code, taken apart: put it right under the code block
     it explains, with one part per piece. Explain a command in full the first
     time it appears; after that, only the pieces that are new. -->
<dl class="border-th-border -mt-2 grid max-w-[60ch] grid-cols-[auto_1fr] gap-x-4 gap-y-1.5 border-l-2 pl-4 text-base">
    [[slot]]
</dl>
