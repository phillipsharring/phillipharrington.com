<!-- Link to a post's comments with their count. On the post itself no
     attributes are needed; elsewhere (a count on /blog) give it
     path="/the-post-slug". The count
     comes from the same JSON in src/comments.js; without JavaScript it just
     says "Comments". -->
<div class="text-sm sm:text-base">
    <a
        href="#comments"
        data-comment-count="[[path]]"
        class="text-th-muted hover:text-th-accent font-serif italic transition-colors duration-200"
        >Comments</a
    >
</div>
