<!-- A block of code or terminal commands. Write the slot flush left in the
     page source: a pre element keeps every space, indentation included.
     The 60ch wrapper is at body size, so the block is exactly as wide as the
     paragraphs (60ch on the pre itself measured its own, smaller font, and
     came out narrower). Long lines wrap rather than scroll.
     Put a prettier-ignore comment on the line before each one in a page:
     Prettier treats the tag as ordinary text and reflows the code inside. -->
<div class="max-w-[60ch]">
    <!-- prettier-ignore -->
    <pre class="bg-th-tint-strong text-th-accent-text rounded px-4 py-3 font-mono text-sm leading-relaxed whitespace-pre-wrap [overflow-wrap:anywhere]"><code>[[slot]]</code></pre>
</div>
