<div class="flex items-center gap-4">
    <span class="flex h-10 w-20 shrink-0 items-center justify-center">
        <img
            src="/img/[[logo]]"
            width="[[w]]"
            height="[[h]]"
            alt=""
            class="[[tone]] max-h-10 w-auto max-w-20"
        />
    </span>
    <!-- self-baseline: this row's baseline is the company name, not the logo, so
         a band's years line up with it. -->
    <div class="self-baseline">
        <p class="text-th-heading leading-snug font-semibold">[[company]]</p>
        <p class="text-th-muted text-sm">[[role]]</p>
        [[slot]]
    </div>
</div>
