<!-- sm:items-baseline puts the years on the same baseline as the first line of
     the right column, whatever starts it (a heading, body text, a job row). -->
<section class="grid gap-x-6 gap-y-1 sm:grid-cols-[7rem_1fr] sm:items-baseline">
    <p class="text-th-muted font-display text-sm tabular-nums sm:text-right">[[years]]</p>
    <div class="space-y-3">[[slot]]</div>
</section>
