<!-- "Steal This": where the code for a post lives. The heading is built in;
     the slot is the paragraphs and lists. A tinted box like callout's, minus the
     accent rule, so it reads as a pointer rather than a pitch. -->
<section class="bg-th-panel space-y-3 rounded-lg px-6 py-7 sm:px-8 sm:py-8">
    <heading h2 id="steal-this">Steal This</heading>
    [[slot]]
</section>
